name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --locked pytest
      - run: uv run --locked nemotron-challenge doctor --offline

  model-service-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12 .venv-model-contract
      - run: uv pip install --python .venv-model-contract/bin/python -r infra/model-service/requirements-test.txt
      - run: .venv-model-contract/bin/python -m pytest -q infra/model-service/tests
